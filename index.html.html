  const stopRows=st.stops.map((p,i)=>`<tr><td>${i+1}</td><td style="white-space:nowrap">${stamp(p.start)}</td><td style="white-space:nowrap">${p.end?stamp(p.end):'ongoing'}</td><td class="r">${fmtMS(p.dur)}</td><td><span class="dot" style="background:${reasonColor(s,p.reason)}"></span>${esc(p.reason||'Not specified')}</td><td>${esc(p.comment||'')}</td></tr>`).join('');
  const p4=`<section class="page" id="p4">${ph(4)}<div class="page-b"><div><h2>Stop analysis</h2><p class="sub">${st.stops.length?`${st.stops.length} stops, ${fmtHM(st.stopMs)} in total. Reasons sorted by lost time.`:'No stops in this series.'}</p></div>
   ${st.stops.length?`<div class="chart">${svgPareto(s,st,980)}</div><div class="tw"><table class="tbl"><thead><tr><th>#</th><th>Start</th><th>End</th><th class="r">Duration</th><th>Reason</th><th>Comment</th></tr></thead><tbody>${stopRows}</tbody></table></div>`:''}</div></section>`;
  const hist=svgHist(st,980);
  const p5=`<section class="page" id="p5">${ph(5)}<div class="page-b"><div><h2>Production</h2><p class="sub">${U} per ${st.bms/MIN} minutes of production time${s.target?', with the target per interval dashed':''}.</p></div><div class="chart">${svgBuckets(s,st,{W:980,H:280})}</div>
   <div><h3>Time between ${U.toLowerCase()}</h3><p class="sub" style="margin-bottom:10px">${st.cycles.length} measurements · average ${fmtSec(st.avgCycle)} · median ${fmtSec(st.medCycle)}. The grey bar collects the slowest 5%.</p>${hist?`<div class="chart">${hist}</div>`:'<p class="muted">Too few registrations for a distribution.</p>'}</div></div></section>`;
  const whys=s.whys.map(w=>{const sp=s.stops.find(p=>p.id===w.stopId);return `<article class="why"><div class="why-h"><span><b>5 Whys</b> · ${stamp(w.t)}</span><span>${sp?'Stop '+stamp(sp.start)+' · '+esc(sp.reason||'not specified'):'Not linked to a stop'}</span></div><div class="why-b"><p class="why-p">${esc(w.problem)}</p><ol class="chain">${w.whys.filter(Boolean).map((x,i)=>`<li><span>${i+1}</span><div>${esc(x)}</div></li>`).join('')}</ol>${w.root?`<div class="root"><span class="lbl">Root cause</span><div>${esc(w.root)}</div></div>`:''}${w.action?`<div><span class="lbl">Countermeasure</span><p>${esc(w.action)}${w.owner?` · <b>${esc(w.owner)}</b>`:''}</p></div>`:''}</div></article>`}).join('');
  const photos=s.photos.map(p=>`<figure>${p.src?`<img src="${esc(p.src)}" alt="${esc(p.caption||'Photo')}" loading="lazy">`:'<div class="ph-none">This photo is only stored in the browser where it was taken</div>'}<figcaption><time>${stamp(p.t)}</time>${esc(p.caption||'')}</figcaption></figure>`).join('');
  const p6=`<section class="page" id="p6">${ph(6)}<div class="page-b"><h2>Problem solving</h2>${whys||'<p class="muted">No 5 Whys analyses in this series.</p>'}<div><h3 style="margin-bottom:12px">Photos</h3>${photos?`<div class="photos">${photos}</div>`:'<p class="muted">No photos in this series.</p>'}</div></div></section>`;
  const ev=buildEvents(s,st);
  const timers=s.timers.length?`<div><h3 style="margin-bottom:10px">Extra timers</h3><div class="tw"><table class="tbl"><thead><tr><th>Name</th><th class="r">Time</th></tr></thead><tbody>${s.timers.map(t=>`<tr><td>${esc(t.name)}</td><td class="r">${fmtDur(timerVal(t,st.end))}</td></tr>`).join('')}</tbody></table></div></div>`:'';
  const p7=`<section class="page" id="p7">${ph(7)}<div class="page-b"><div><h2>Event log</h2><p class="sub">Every action with date and time, including corrections and deletions.</p></div>${timers}<div class="tw"><table class="tbl"><thead><tr><th>Date</th><th>Time</th><th>Event</th></tr></thead><tbody>${ev.map(e=>`<tr><td style="white-space:nowrap">${dShort(e.t)}</td><td style="white-space:nowrap">${clockS(e.t)}</td><td>${e.h}</td></tr>`).join('')}</tbody></table></div></div></section>`;
  return p1+p2+p3+p4+p5+p6+p7}
function reportScreenHTML(){const rep=S.view;if(!rep)return '';const s=rep.session;const per=(s.segments||[]).length||1;const liveOther=S.session&&!S.session.endedAt;
  return `<div class="rep-bar"><button class="btn ghost" data-act="home">${ico('back')}All reports</button><div class="row">${s.demo?'':`<button class="btn primary" data-act="resume-report" data-id="${esc(rep.id)}">${ico('play')}Resume SUPERMAX</button>`}<button class="btn" data-act="dl-html">${ico('dl')}Report (HTML)</button><button class="btn" data-act="dl-csv">${ico('dl')}Data (CSV)</button><button class="btn" data-act="copy-sum">${ico('copy')}Copy summary</button></div></div>
  ${s.demo?'<div class="notice demo"><span><b>Example report</b> with sample data. It is not saved and cannot be resumed.</span></div>':`<div class="notice resume"><span>Last saved <b>${stamp(rep.end)}</b> · ${per} period${per>1?'s':''}. Resume to keep recording; this report updates when you end again.</span>${liveOther?'<span class="muted">Another SUPERMAX is running. End it before resuming this one.</span>':''}</div>`}
  <nav class="rep-nav" aria-label="Pages">${PAGES.map((n,i)=>`<a href="#p${i+1}" data-act="jump" data-p="p${i+1}">${i+1} · ${n}</a>`).join('')}</nav>
  <div class="report">${reportPages(rep)}</div>`}
async function downloadHTML(){const rep=S.view;const s=rep.session;const css=$('#css').textContent;
  const html=`<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUPERMAX report · ${esc(s.area)} · ${dShort(s.startedAt)}</title><style>${css}</style></head><body class="export"><main><div class="report">${reportPages(rep).replace(/<button[^>]*>.*?<\/button>/g,'')}</div></main></body></html>`;
  await saveFile(`SUPERMAX_${safe(s.area)}_${fileDate(s.startedAt)}.html`,new Blob([html],{type:'text/html'}))}
async function downloadCSV(){const rep=S.view;const s=rep.session;const st=computeStats(s);const rows=[['date','time','iso_utc','type','detail','value']];
  buildEvents(s,st).forEach(e=>{if(e.csv)rows.push([dShort(e.t),clockS(e.t),new Date(e.t).toISOString(),...e.csv])});
  rows.push([]);rows.push(['hour_start','hour','production_min',lc(uPl(s)),lc(perHour(s)).replace(/ /g,'_'),'stops','stop_min','availability','scrap']);
  st.hr.rows.forEach(r=>rows.push([stamp(r.h),hourLbl(r.h),(r.active/MIN).toFixed(1),r.units,r.rate==null?'':r.rate.toFixed(2),r.stops,(r.stopMs/MIN).toFixed(1),r.avail==null?'':r.avail.toFixed(3),r.scrap]));
  const csv='﻿'+rows.map(r=>r.map(v=>{v=String(v==null?'':v);return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(';')).join('\n');
  await saveFile(`SUPERMAX_${safe(s.area)}_${fileDate(s.startedAt)}.csv`,new Blob([csv],{type:'text/csv'}))}
async function saveFile(filename,blob){if(cloud.downloads){try{await cloud.downloads.save({filename,data:blob})}catch(e){if(e&&e.code!=='declined'&&e.code!=='cancelled')toast('The download did not complete')}return}
  try{const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}catch(e){toast('The download did not complete')}}
const safe=x=>String(x).replace(/[^\w-]+/g,'_').slice(0,40);
const fileDate=t=>{const d=new Date(t);return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes())};
async function copySummary(){const s=S.view.session;const st=computeStats(s);const txt=`SUPERMAX · ${s.area} · ${s.product}\n${stamp(st.start)} → ${stamp(st.end)} (${fmtHM(st.total)} production time${st.segs.length>1?', '+st.segs.length+' periods':''})\n${uPl(s)}: ${st.units} · ${nf(st.rateH,1)} per hour${s.target?' (target '+nf(s.target,1)+')':''} · availability ${pct(st.avail)} · OEE ${pct(st.oee)}\nStops: ${st.stops.length} (${fmtHM(st.stopMs)})${st.reasons[0]?' · biggest: '+st.reasons[0].r:''}\n\n${conclusion(s,st)}`;
  try{await navigator.clipboard.writeText(txt);toast('Summary copied')}catch(e){openModal('Copy summary',`<textarea class="inp" id="cpT" style="min-height:220px">${esc(txt)}</textarea>`,'<span></span><button class="btn" data-act="close-modal">Close</button>',()=>{const t=$('#cpT');t.focus();t.select()})}}

/* ---------- demo ---------- */
function demoReport(){let a=1234567;const rnd=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};let n=0;const did=p=>p+'_demo'+(n++);
  const M=MIN;const e5=Math.floor(now()/(5*M))*(5*M)-5*M;const s2=e5-215*M;const s1=s2-16*HOUR+20*M;
  const L1=200*M;const R=o=>Math.floor(o<L1?s1+o:s2+(o-L1));const total=L1+215*M;const start=s1,end=R(total);
  const s=newSession({area:'Line 2 · Packaging',product:'Flexibatts 37 · 95 mm',observer:'Example',unitKey:'ruller',customName:'',target:14,reasons:DEFAULT_REASONS});
  s.id='demo';s.demo=true;s.startedAt=start;s.endedAt=end;s.segments=[{start:s1,end:s1+L1},{start:s2,end}];
  const defs=[[22,6,'Material shortage','Wrapping film ran out'],[61,14,'Machine breakdown','Stacker fault, sensor cleaned'],[95,4,'Waiting for forklift',''],[150,9,'Changeover','Change to 95 mm'],[236,3,'Quality issue','Skewed stacking, corrected'],[300,11,'Material shortage','Empty pallets not staged'],[370,5,'Cleaning','']];
  s.stops=defs.map(([m,d,r,c])=>({id:did('s'),start:R(m*M+rnd()*40e3),end:R((m+d)*M+rnd()*40e3),reason:r,comment:c}));
  const so=s.stops.map(p=>[p.start,p.end]);let o=2*M;while(o<total-M){const t=R(o);const inS=so.find(p=>t>=p[0]&&t<p[1]);if(inS){o+=M;continue}s.units.push({id:did('u'),t,d:1,src:'click'});o+=(3.0+rnd()*1.9)*M+(rnd()<.07?4*M:0)}
  s.units.push({id:did('u'),t:R(100*M),d:-1,src:'edit'});
  s.scrap=[{id:did('k'),t:R(240*M),d:1}];
  s.log=[{id:did('a'),t:R(66*M),k:'Reason set',text:'stop '+stamp(s.stops[1].start)+': Machine breakdown'},{id:did('a'),t:R(149*M),k:'Timer started',text:'Changeover to 95 mm'},{id:did('a'),t:R(160*M),k:'Timer paused',text:'Changeover to 95 mm · 00:09:14'}];
  s.whys=[{id:did('w'),t:R(76*M),problem:'The stacker faults and stops the line',whys:['The photocell at the infeed does not detect the packs','The lens is covered in dust from the cutting','Extraction at the saw is reduced','The filter was not changed on schedule','Filter change is not on the weekly TPM list'],root:'Filter change is not on the weekly TPM list',action:'Add filter change and photocell cleaning to weekly TPM. Fit a visual indicator on the filter.',owner:'Maintenance, shift lead',stopId:s.stops[1].id}];
  s.notes=[{id:did('n'),t:R(30*M),text:'New operator being trained on the stacker'},{id:did('n'),t:R(L1+M),text:'Resumed next morning after the night break'}];
  s.timers=[{id:did('t'),name:'Changeover to 95 mm',elapsed:9*M+14e3,runningSince:null}];
  const st=computeStats(s);return{kind:'report',id:'demo',savedAt:end,area:s.area,product:s.product,unitPl:uPl(s),units:st.units,start,end,active:st.total,periods:2,avail:st.avail,session:s}}

/* ---------- wake lock ---------- */
let wl=null;async function wake(){try{if(navigator.wakeLock&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}}catch(e){}}
function releaseWake(){try{wl&&wl.release()}catch(e){}wl=null}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.screen==='run')wake()});

/* ---------- events ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act;const s=S.session;
  switch(act){
   case 'home':S.view=null;go('home');break;
   case 'new':S.setup=null;go('setup');break;
   case 'resume':go('run');break;
   case 'demo':S.view=demoCache||(demoCache=demoReport());go('report');break;
   case 'sound':S.prefs.sound=!S.prefs.sound;savePrefs();header();if(S.prefs.sound)sfx.tick();break;
   case 'add-reason':addReason();break;
   case 'rm-reason':S.setup.reasons.splice(+b.dataset.i,1);paintChips();break;
   case 'stop':toggleStop();break;
   case 'unit':addUnit();break;
   case 'why':whyModal();break;
   case 'photo':$('#photoIn').click();break;
   case 'stop-reason':{const os=openStop(s);if(os)reasonModal(os.id);break}
   case 'stop-edit':if(S.screen==='run')reasonModal(b.dataset.id);break;
   case 'why-edit':whyModal(b.dataset.id);break;
   case 'photo-view':photoView(b.dataset.id);break;
   case 'adj':{const d=+b.dataset.d;if(d<0&&unitCount(s)<=0)break;s.units.push({id:rid('u'),t:now(),d,src:'edit'});saveActive();updateRun();sfx.tick();break}
   case 'scrap':{const d=+b.dataset.d;if(d<0&&scrapCount(s)<=0)break;s.scrap.push({id:rid('k'),t:now(),d});saveActive();updateRun();sfx.tick();break}
   case 'del-unit':{const u=s&&s.units.find(x=>x.id===b.dataset.id);if(!u)break;s.units=s.units.filter(x=>x.id!==u.id);logAct('Registration deleted',`${u.d>0?'+':''}${u.d} ${uSg(s)} from ${stamp(u.t)}`);saveActive();updateRun();break}
   case 'del-note':{const n=s&&s.notes.find(x=>x.id===b.dataset.id);if(!n)break;s.notes=s.notes.filter(x=>x.id!==n.id);logAct('Note deleted',`${n.text} (written ${stamp(n.t)})`);saveActive();updateRun();break}
   case 'xt-toggle':{const t=s.timers.find(x=>x.id===b.dataset.id);if(!t)break;if(t.runningSince){t.elapsed+=now()-t.runningSince;t.runningSince=null;logAct('Timer paused',`${t.name} · ${fmtDur(t.elapsed)}`)}else{t.runningSince=now();logAct('Timer restarted',`${t.name} · ${fmtDur(t.elapsed)}`)}saveActive();updateRun();sfx.tick();break}
   case 'xt-reset':{const t=s.timers.find(x=>x.id===b.dataset.id);if(!t)break;logAct('Timer reset',`${t.name} · was ${fmtDur(timerVal(t))}`);t.elapsed=0;if(t.runningSince)t.runningSince=now();saveActive();updateRun();break}
   case 'xt-del':{const t=s.timers.find(x=>x.id===b.dataset.id);if(!t)break;logAct('Timer deleted',`${t.name} · ${fmtDur(timerVal(t))}`);s.timers=s.timers.filter(x=>x.id!==t.id);saveActive();updateRun();break}
   case 'resume-report':resumeReport(b.dataset.id);break;
   case 'end-ask':endAsk();break;
   case 'close-modal':closeModal();break;
   case 'open-report':S.view=S.reports.find(r=>r.id===b.dataset.id);if(S.view)go('report');break;
   case 'del-report':{if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Confirm delete';setTimeout(()=>{if(document.body.contains(b)){b.classList.remove('armed');b.textContent='Delete'}},4000);break}
     const id=b.dataset.id;S.reports=S.reports.filter(r=>r.id!==id);LS.set(K_REPORTS,S.reports);cloudWrite(id,null);render();toast('Report deleted');break}
   case 'dl-html':downloadHTML();break;
   case 'dl-csv':downloadCSV();break;
   case 'copy-sum':copySummary();break;
   case 'jump':{e.preventDefault();const el=document.getElementById(b.dataset.p);if(el)el.scrollIntoView({behavior:reduceMotion?'auto':'smooth'});break}
  }});
document.addEventListener('keydown',e=>{if(modalOpen()){if(e.key==='Escape')closeModal();return}
  if(S.screen!=='run'||!S.session)return;const tag=(e.target.tagName||'').toLowerCase();if(tag==='input'||tag==='textarea'||tag==='select'||tag==='button'&&e.key===' ')return;if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='1'){e.preventDefault();toggleStop()}else if(e.key==='2'||e.key===' '||e.key==='+'){e.preventDefault();addUnit()}else if(e.key==='3'){e.preventDefault();whyModal()}else if(e.key==='4'){e.preventDefault();$('#photoIn').click()}});

/* ---------- boot ---------- */
if(S.session&&!S.session.endedAt){ensureSegs(S.session);S.screen='run'}else if(S.session&&S.session.endedAt){S.session=null;LS.del(K_ACTIVE)}
render();if(S.screen==='run'){wake();setTimeout(()=>toast('Running SUPERMAX restored'),300)}
initCloud();
})();
</script>
